apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-calc-deployment
  labels:
    app: student-calc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-calc
  template:
    metadata:
      labels:
        app: student-calc
    spec:
      containers:
      - name: student-calc
        image: DOCKERHUB_USERNAME_PLACEHOLDER/student-calc:IMAGE_TAG_PLACEHOLDER
        ports:
        - containerPort: 8080
